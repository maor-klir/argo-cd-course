apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    # A Helm repository, not a Git repository — so `chart` replaces `path`
    # and `targetRevision` is a chart version rather than a Git ref.
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.45.0
    helm:
      valuesObject:
        clusterRoleBinding:
          # The chart binds its ServiceAccount to cluster-admin by default.
          # Read-only is enough to browse a cluster.
          clusterRoleName: view
        config:
          oidc:
            # No OIDC provider here, so skip the empty Secret the chart
            # would otherwise render.
            secret:
              create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
